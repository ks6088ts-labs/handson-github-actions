name: "Extra Manual Task"
on:
  workflow_dispatch:
    inputs:
      target:
        description: 確認するフォルダー
        type: choice
        options:
          - guidelines
          - sources
        default: guidelines
permissions:
  contents: read
jobs:
  list-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: 選んだフォルダーを表示する
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            guidelines|sources) ls -R -- "$TARGET" ;;
            *) echo '対象外のフォルダーです' >&2; exit 1 ;;
          esac