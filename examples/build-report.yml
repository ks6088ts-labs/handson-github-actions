name: "Extra Build Report"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: 一覧を作成する
        run: |
          mkdir -p out
          find guidelines -name '*.md' -type f > out/report.txt
      - name: 一覧をアップロードする
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guideline-report
          path: out/report.txt
          retention-days: 1
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 前の job の一覧を受け取る
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: guideline-report
      - name: Summary に表示する
        run: |
          {
            echo '## ガイドライン一覧'
            echo ''
            sed 's/^/- /' report.txt
          } >> "$GITHUB_STEP_SUMMARY"