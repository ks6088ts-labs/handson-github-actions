name: "Extra Daily Check"
on:
  schedule:
    - cron: "17 0 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: JST の時刻を確認する
        env:
          TZ: Asia/Tokyo
        run: date '+%Y-%m-%d %H:%M:%S %Z'
      - name: 変更を検知する（PR は作らない）
        run: bash scripts/compare-source.sh