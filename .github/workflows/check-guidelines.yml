name: "02 Check Guidelines"
on:
  push:
    paths:
      - "guidelines/**/*.md"
  pull_request:
    paths:
      - "guidelines/**/*.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: ガイドラインの見出しを検査する
        run: bash scripts/check-guidelines.sh